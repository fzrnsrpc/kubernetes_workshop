{% extends 'base.html' %}
{% block title %}Home{% endblock %}
{% block content %}
<h1>Clothing Items</h1>
<div class="row">
  {% for item in items %}
  <div class="col-md-4">
    <div class="card mb-4">
      <img src="{{ url_for('static', filename='uploads/' ~ item.image) }}" class="card-img-top" alt="{{ item.name }}">
      <div class="card-body">
        <h5 class="card-title">{{ item.name }}</h5>
        <p class="card-text">${{ '%.2f'|format(item.price) }}</p>
        <a href="/add_to_cart/{{ item.id }}" class="btn btn-primary">Add to Cart</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
